plugins {
    id 'com.android.library'
}

android {
    namespace 'rikka.shizuku.common'
    defaultConfig {
        buildConfigField 'String', 'MANAGER_APPLICATION_ID', '"' + rootProject.ext.managerApplicationId + '"'
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    compileOnly libs.hidden.stub
}
