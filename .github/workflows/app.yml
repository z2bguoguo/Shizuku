name: Build and release fork

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'z2bguoguo/Shizuku'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate build identity
        id: identity
        shell: bash
        run: |
          PACKAGE_ID="app.p$(openssl rand -hex 12).m$(openssl rand -hex 6)"
          echo "PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "release_tag=build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          printf 'managerApplicationId=%s\n' "$PACKAGE_ID" >> gradle.properties
      - name: Configure signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          SIGNING_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEY" ]]; then
            test -n "$SIGNING_PASSWORD" && test -n "$SIGNING_ALIAS" && test -n "$SIGNING_ALIAS_PASSWORD"
            printf '%s' "$SIGNING_KEY" | base64 --decode > key.jks
            python3 - <<'PY'
          import os
          def escape(s):
              return s.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          values = {'KEYSTORE_FILE': '../key.jks', 'KEYSTORE_PASSWORD': os.environ['SIGNING_PASSWORD'], 'KEYSTORE_ALIAS': os.environ['SIGNING_ALIAS'], 'KEYSTORE_ALIAS_PASSWORD': os.environ['SIGNING_ALIAS_PASSWORD']}
          with open('signing.properties', 'w') as f:
              f.write(''.join(k + '=' + escape(v) + '\n' for k, v in values.items()))
          PY
            echo 'SIGNING_MODE=custom-keystore' >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$GITHUB_WORKSPACE/key.jks" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Fork Build,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
            printf '%s\n' 'KEYSTORE_FILE=../key.jks' 'KEYSTORE_PASSWORD=android' 'KEYSTORE_ALIAS=androiddebugkey' 'KEYSTORE_ALIAS_PASSWORD=android' > signing.properties
            echo 'SIGNING_MODE=ephemeral-build-key' >> "$GITHUB_ENV"
          fi
      - name: Install build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Check source and build
        run: |
          python3 tests/check_fork.py
          python3 tests/check_native_server_names.py
          chmod +x gradlew
          ./gradlew :manager:testReleaseUnitTest :manager:assembleRelease :connection-probe:assembleDebug :connection-peer:assembleDebug --stacktrace
      - name: Print failed test reports
        if: failure()
        run: find manager/build/test-results -name '*.xml' -exec cat {} + 2>/dev/null || true
      - name: Verify APK and prepare release
        shell: bash
        run: |
          mkdir -p release
          cp manager/build/outputs/apk/release/*.apk release/
          APK=$(find release -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > release/signing-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > release/apk-badging.txt
          grep -F "package: name='$PACKAGE_ID'" release/apk-badging.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > release/AndroidManifest.xml
          python3 tests/check_fork.py release/AndroidManifest.xml
          printf '%s\n' "$PACKAGE_ID" > release/package-name.txt
          python3 .github/scripts/release_notes.py > release/release-notes.md
          (cd release && sha256sum *.apk > SHA256SUMS)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: fork-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error
      - name: Upload test client
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ env.RELEASE_TAG }}
          path: |
            connection-probe/build/outputs/apk/debug/*.apk
            connection-peer/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f key.jks signing.properties

  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: fork-${{ needs.build.outputs.release_tag }}
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: probe-${{ needs.build.outputs.release_tag }}
          path: probe-apks/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android 14 user service connection
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/test_user_service.sh
      - name: Upload device test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-${{ needs.build.outputs.release_tag }}
          path: device-test/
          if-no-files-found: ignore

  publish:
    needs: [build, device-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fork-${{ needs.build.outputs.release_tag }}
          path: release/
      - name: Publish prerelease in this fork
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Shizuku fork $RELEASE_TAG" --notes-file release/release-notes.md --prerelease
